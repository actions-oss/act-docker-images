name: Copy full images

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: ''
        default: latest
  schedule:
    - cron: 0 12 */7 * *

env:
  SLUG: ${{ github.repository_owner }}/act-full
  PUSH_GHCR: ${{ github.repository == (github.event.pull_request.head.repo.full_name || github.repository) && '1' || '' }}
  PUSH_QUAY: ${{ secrets.QUAY_USER && secrets.QUAY_TOKEN && '1' || '' }}
  PUSH_DOCKER_HUB: ${{ secrets.DOCKER_USER && secrets.DOCKER_PASS && '1' || '' }}

defaults:
  run:
    shell: sh

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          echo matrix=$(docker buildx bake copy_full --print | jq -rc '[.target[] | .args] | unique_by(.target)') | tee -a "${GITHUB_OUTPUT}"
  copy:
    name: copy image ${{ matrix.copy.src }}
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        copy: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Force SLUG to lowercase
        uses: actions/github-script@v6
        with:
          github-token: n/a
          script: |
            core.exportVariable('SLUG', process.env.SLUG.toLowerCase());

      - name: Login to GitHub Container Registry
        if: env.PUSH_GHCR
        uses: docker://quay.io/skopeo/stable
        with:
          args: |-
            copy -a
            --src-creds ${{ github.actor }}:${{ github.token }}
            --dest-creds ${{ github.actor }}:${{ github.token }}
            docker://${{ matrix.copy.source }}
            docker://ghcr.io/${{ env.SLUG }}:${{ matrix.copy.target }}

      - name: Login to Docker Hub
        if: env.PUSH_DOCKER_HUB
        uses: docker://quay.io/skopeo/stable
        with:
          args: |-
            copy -a
            --src-creds ${{ github.actor }}:${{ github.token }}
            --dest-creds ${{ secrets.DOCKER_USER }}:${{ secrets.DOCKER_PASS }}
            docker://${{ matrix.copy.source }}
            docker://docker.io/${{ env.SLUG }}:${{ matrix.copy.target }}
